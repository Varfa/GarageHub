{{ define "content" }}
<div class="employees-page">
    <div class="page-header">
        <div>
            <h1>Новый сотрудник</h1>
            <p>Заполните основные данные сотрудника.</p>
        </div>

        <div class="page-header-actions">
            <a href="/employees" class="btn-secondary">
                Назад
            </a>
        </div>
    </div>

    <div class="details-card employee-form-card">
        {{ if .Error }}
        <div class="form-error">
            {{ .Error }}
        </div>
        {{ end }}

        <form action="/employees/create" method="POST" class="employee-form">
            <div class="form-group">
                <label for="first_name">
                    Имя
                </label>

                <input type="text" id="first_name" name="first_name" placeholder="Введите имя" autocomplete="given-name"
                    required>
            </div>

            <div class="form-group">
                <label for="last_name">
                    Фамилия
                </label>

                <input type="text" id="last_name" name="last_name" placeholder="Введите фамилию"
                    autocomplete="family-name" required>
            </div>

            <div class="form-group">
                <label for="phone">
                    Телефон
                </label>

                <input type="tel" id="phone" name="phone" placeholder="+370..." autocomplete="tel" required>
            </div>

            <div class="form-group">
                <label for="position_id">
                    Должность
                </label>

                <select id="position_id" name="position_id" required>
                    <option value="">
                        Выберите должность
                    </option>

                    {{ range .Positions }}
                    <option value="{{ .ID }}">
                        {{ .Name }}
                    </option>
                    {{ end }}
                </select>
            </div>

            <div class="form-actions">
                <a href="/employees" class="btn-secondary">
                    Отмена
                </a>

                <button type="submit" class="btn-primary">
                    Создать сотрудника
                </button>
            </div>
        </form>
    </div>
</div>
{{ end }}
