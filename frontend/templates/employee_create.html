{{ define "content" }}

<div class="page-header-actions">
    <a href="/employees" class="btn-secondary">
        {{ t "employee.create.back" }}
    </a>
</div>

<div class="details-card employee-form-card">
    {{ if .Error }}
    <div class="form-error">
        {{ .Error }}
    </div>
    {{ end }}

    <form action="/employees/create" method="POST" class="employee-form">
        <div class="form-group">
            <label for="first_name">
                {{ t "employee.create.first_name" }}
            </label>

            <input type="text" id="first_name" name="first_name"
                placeholder='{{ t "employee.create.first_name_placeholder" }}' autocomplete="given-name" required>
        </div>

        <div class="form-group">
            <label for="last_name">
                {{ t "employee.create.last_name" }}
            </label>

            <input type="text" id="last_name" name="last_name"
                placeholder='{{ t "employee.create.last_name_placeholder" }}' autocomplete="family-name" required>
        </div>

        <div class="form-group">
            <label for="phone">
                {{ t "employee.create.phone" }}
            </label>

            <input type="tel" id="phone" name="phone" placeholder="+370..." autocomplete="tel" required>
        </div>

        <div class="form-group">
            <label for="position_id">
                {{ t "employee.create.position" }}
            </label>

            <select id="position_id" name="position_id" required>
                <option value="">
                    {{ t "employee.create.select_position" }}
                </option>

                {{ range .Positions }}
                <option value="{{ .ID }}">
                    {{ positionName .Code .Name }}
                </option>
                {{ end }}
            </select>
        </div>

        <div class="form-actions">
            <a href="/employees" class="btn-secondary">
                {{ t "employee.create.cancel" }}
            </a>

            <button type="submit" class="btn-primary">
                {{ t "employee.create.submit" }}
            </button>
        </div>
    </form>
</div>

{{ end }}
