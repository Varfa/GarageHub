{{ define "content" }}

<div class="page-header-actions">
    <a href="/warehouse" class="btn-secondary">
        {{ t "warehouse.create.back" }}
    </a>
</div>

{{ if .Error }}
<div class="form-error" role="alert">
    {{ .Error }}
</div>
{{ end }}

<form method="POST" action="/warehouse/create" class="employee-edit-form">
    <label>
        {{ t "warehouse.create.name" }}

        <input type="text" name="name" placeholder='{{ t "warehouse.create.name_placeholder" }}' required>
    </label>

    <label>
        {{ t "warehouse.create.sku" }}

        <input type="text" name="sku" placeholder='{{ t "warehouse.create.sku_placeholder" }}' required>
    </label>

    <label>
        {{ t "warehouse.create.manufacturer" }}

        <input type="text" name="manufacturer" placeholder='{{ t "warehouse.create.manufacturer_placeholder" }}'>
    </label>

    <label>
        {{ t "warehouse.create.purchase_price" }}

        <input type="number" name="purchase_price" min="0" step="0.01" value="0.00" required>
    </label>

    <label>
        {{ t "warehouse.create.sale_price" }}

        <input type="number" name="sale_price" min="0" step="0.01" value="0.00" required>
    </label>

    <label>
        {{ t "warehouse.create.quantity" }}

        <input type="number" name="quantity" min="0" step="1" value="0" required>
    </label>

    <label>
        {{ t "warehouse.create.min_quantity" }}

        <input type="number" name="min_quantity" min="0" step="1" value="0" required>
    </label>

    <label>
        {{ t "warehouse.create.location" }}

        <input type="text" name="location" placeholder='{{ t "warehouse.create.location_placeholder" }}'>
    </label>

    <label class="employee-form-full">
        {{ t "warehouse.create.note" }}

        <textarea name="note" rows="4" placeholder='{{ t "warehouse.create.note_placeholder" }}'></textarea>
    </label>

    <div class="employee-edit-actions">
        <button class="btn-primary" type="submit">
            {{ t "warehouse.create.submit" }}
        </button>

        <a href="/warehouse" class="btn-secondary">
            {{ t "warehouse.create.cancel" }}
        </a>
    </div>
</form>

{{ end }}
