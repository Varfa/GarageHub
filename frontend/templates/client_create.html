{{ define "content" }}

<div class="page-header">
    <div class="page-header-actions">
        <a class="btn-secondary" href="/clients">
            {{ t "clients.create_page.back" }}
        </a>
    </div>
</div>

<div class="details-card form-card">
    {{ if .Error }}
    <div class="form-error">
        {{ .Error }}
    </div>
    {{ end }}

    <form id="client-form" class="edit-form" method="POST" action="/clients/create">
        <label>
            {{ t "clients.create_page.name" }}

            <input type="text" name="name" placeholder='{{ t "clients.create_page.name_placeholder" }}'
                autocomplete="name" required>
        </label>

        <label>
            {{ t "clients.create_page.phone" }}

            <input type="tel" name="phone" placeholder="+370..." autocomplete="tel" required>
        </label>

        <label>
            {{ t "clients.create_page.email" }}

            <input type="email" name="email" placeholder="client@example.com" autocomplete="email">
        </label>

        <label>
            {{ t "clients.create_page.address" }}

            <input type="text" name="address" placeholder='{{ t "clients.create_page.address_placeholder" }}'
                autocomplete="street-address">
        </label>

        <label class="full-width">
            {{ t "clients.create_page.note" }}

            <textarea name="note" placeholder='{{ t "clients.create_page.note_placeholder" }}'></textarea>
        </label>

        <div class="form-actions">
            <a class="btn-secondary" href="/clients">
                {{ t "clients.create_page.cancel" }}
            </a>

            <button class="btn-primary" type="submit">
                {{ t "clients.create_page.submit" }}
            </button>
        </div>
    </form>
</div>

{{ end }}
