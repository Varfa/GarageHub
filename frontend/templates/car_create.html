{{ define "content" }}

{{ if .Error }}
<div class="form-error" role="alert">
    {{ .Error }}
</div>
{{ end }}

<form method="POST" action="/cars/create" class="edit-form">

    <label>
        {{ t "car.create.client" }}

        <select name="client_id">
            <option value="">
                {{ t "car.create.select_client" }}
            </option>

            {{ range .Clients }}
            <option value="{{ .ID }}">
                {{ .Name }} — {{ .Phone }}
            </option>
            {{ end }}
        </select>

        <a class="create-related-link" href="/clients/create">
            ➕ {{ t "car.create.new_client" }}
        </a>
    </label>

    <label>
        {{ t "car.brand" }}
        <input type="text" name="brand">
    </label>

    <label>
        {{ t "car.model" }}
        <input type="text" name="model">
    </label>

    <label>
        {{ t "car.year" }}
        <input type="number" name="year">
    </label>

    <label>
        {{ t "car.plate_number" }}
        <input type="text" name="plate_number">
    </label>

    <label>
        VIN
        <input type="text" name="vin">
    </label>

    <label>
        {{ t "car.engine" }}
        <input type="text" name="engine">
    </label>

    <label>
        {{ t "car.power_kw" }}
        <input type="number" name="power_kw">
    </label>

    <label>
        {{ t "car.color" }}
        <input type="text" name="color">
    </label>

    <label>
        {{ t "car.mileage" }}
        <input type="number" name="mileage">
    </label>

    <label class="full-width">
        {{ t "car.note" }}
        <textarea name="note"></textarea>
    </label>

    <div class="edit-actions">
        <button class="btn-primary" type="submit">
            💾 {{ t "car.create.submit" }}
        </button>

        <a class="btn-secondary" href="/cars">
            ❌ {{ t "car.cancel" }}
        </a>
    </div>

</form>

{{ end }}
