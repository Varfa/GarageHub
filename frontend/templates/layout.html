<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="/static/css/style.css">
    <title>GarageHub</title>
</head>

<body>
    <header>
        <div class="logo">GarageHub</div>

        <div class="header-right">
            <div class="language-switcher">
                <button type="button">RU</button>
                <button type="button">EN</button>
                <button type="button">LT</button>
            </div>

            <div class="user">
                <span>Roman</span>
                <button type="button" data-i18n="button.logout">Выход</button>
            </div>
        </div>
    </header>

    <main>
        <nav>
            <ul>
                <li><a href="/dashboard" data-i18n="nav.dashboard">📊 Dashboard</a></li>
                <li><a href="/clients" data-i18n="nav.clients">👤 Клиенты</a></li>
                <li><a href="/cars" data-i18n="nav.cars">🚘 Автомобили</a></li>
                <li><a href="/orders" data-i18n="nav.orders">📋 Заказы</a></li>
                <li><a href="/parts" data-i18n="nav.parts">🔧 Запчасти</a></li>
                <li><a href="/warehouse" data-i18n="nav.warehouse">📦 Склад</a></li>
                <li><a href="/employees" data-i18n="nav.employees">👨‍🔧 Сотрудники</a></li>
                <li><a href="/reports" data-i18n="nav.reports">📈 Отчеты</a></li>
                <li><a href="/settings" data-i18n="nav.settings">⚙ Настройки</a></li>
            </ul>

        </nav>

        <section class="content">
            <div class="page-header">
                <h1 data-i18n="title.dashboard">Dashboard</h1>
                <p data-i18n="message.dashboard_welcome">Обзор работы автосервиса</p>
            </div>

            <div class="stats-grid">
                <div class="stat-card">
                    <h3 data-i18n="card.clients">Клиенты</h3>
                    <p>0</p>
                </div>

                <div class="stat-card">
                    <h3 data-i18n="card.cars">Автомобили</h3>
                    <p>0</p>
                </div>

                <div class="stat-card">
                    <h3 data-i18n="card.active_orders">Активные заказы</h3>
                    <p>0</p>
                </div>

                <div class="stat-card">
                    <h3 data-i18n="card.month_income">Доход за месяц</h3>
                    <p>0 €</p>
                </div>
            </div>

        </section>
    </main>
</body>

</html>
